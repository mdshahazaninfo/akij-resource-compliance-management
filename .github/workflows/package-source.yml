name: Package Full Source Code

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload full source package
        uses: actions/upload-artifact@v4
        with:
          name: Compliance_Management_System_Control_Tower_Full_Source_Code
          path: |
            .
            !.git/**
            !node_modules/**
            !.env
            !.env.local
            !.vercel/**
          include-hidden-files: true
          retention-days: 7
